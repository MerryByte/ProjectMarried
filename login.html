<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#203127">
  <title>Login | Anatoliy & Elizabeth</title>
  <meta name="description" content="Log in to view or update your wedding reservation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&family=Italiana&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rsvp.css?v=14">
</head>
<body>
  <header><a class="monogram" href="index.html">A <i>&</i> E</a><button class="nav-toggle" type="button" aria-expanded="false" aria-controls="loginNav">Menu</button><nav class="header-actions" id="loginNav" aria-label="Page navigation"><a href="index.html">Home</a><a href="index.html#schedule">Schedule</a><a href="rsvp.html#photos">Photos</a><a href="rsvp.html">RSVP</a></nav></header>
  <main>
    <section class="card">
      <p class="eyebrow">Welcome back</p>
      <h1>Log in</h1>
      <p class="intro" id="loginIntro">Access your household reservation and update your response anytime.</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" minlength="8" autocomplete="current-password" required></label>
        <button id="loginSubmit" type="submit">Log in</button>
      </form>
      <p class="status" id="loginStatus" role="status" aria-live="polite"></p>
      <p class="account-link">Need an account? <a id="signupLink" href="signup.html">Create one</a></p>
    </section>
  </main>
  <script src="config.js?v=2"></script>
  <script src="nav.js?v=2"></script>
  <script src="login.js?v=3"></script>
</body>
</html>
