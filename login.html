<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Anatoliy & Elizabeth</title>
  <meta name="description" content="Log in to view or update your wedding reservation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italiana&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rsvp.css">
</head>
<body>
  <header><a class="monogram" href="index.html">A <i>&</i> L</a><a class="home-link" href="index.html">Home</a></header>
  <main>
    <section class="card">
      <p class="eyebrow">Welcome back</p>
      <h1>Log in</h1>
      <p class="intro">Access your household reservation and update your response anytime.</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" minlength="8" autocomplete="current-password" required></label>
        <button id="loginSubmit" type="submit">Log in</button>
      </form>
      <p class="status" id="loginStatus" role="status" aria-live="polite"></p>
      <p class="account-link">Need an account? <a href="signup.html">Create one</a></p>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="login.js?v=2"></script>
</body>
</html>
