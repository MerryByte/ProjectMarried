<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Gallery | Anatoliy & Elizabeth</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italiana&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header>
    <a class="monogram" href="index.html">A <i>&</i> L</a>
    <button id="logoutButton" type="button" hidden>Log out</button>
  </header>

  <main>
    <section class="login" id="loginSection">
      <p class="eyebrow">For our eyes only</p>
      <h1>Private gallery</h1>
      <p>Sign in to view and download the memories shared by our guests.</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="anatoliybar@gmail.com" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Open gallery</button>
      </form>
      <p class="status" id="loginStatus" role="status" aria-live="polite"></p>
    </section>

    <section class="gallery" id="gallerySection" hidden>
      <div class="gallery-heading">
        <div>
          <p class="eyebrow">Guest memories</p>
          <h1>Our gallery</h1>
        </div>
        <p id="photoCount"></p>
      </div>
      <p class="status" id="galleryStatus" role="status" aria-live="polite">Loading photos…</p>
      <div class="photo-grid" id="photoGrid"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
